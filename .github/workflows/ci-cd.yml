name: Task Manager CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Backend Dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      # 4. Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # 5. Lint Backend
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      # 6. Lint Frontend
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      # 7. Build Frontend
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # 8. Run Backend Tests
      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

      # 9. Package Frontend Artifact
      - name: Package Frontend
        run: tar -czf frontend-build.tar.gz -C frontend dist

      # 10. Upload Frontend Artifact
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz