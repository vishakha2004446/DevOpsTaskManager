services:
  mongodb:
    image: mongo:7
    container_name: task-manager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: task-manager-backend
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/task_manager
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: task-manager-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data: